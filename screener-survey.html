<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screener Survey - Mick Skylark: Mini Golf Prodigy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{--primary:#1E3A8A;--primary-dark:#1E40AF;--secondary:#FCD34D;--gold:#FBBF24;--dark:#1F2937;}
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;color:var(--dark);
      background:linear-gradient(135deg,#87CEEB 0%,#5DADE2 100%);
      min-height:100vh;padding:90px 20px 40px;
    }
    .topbar{
      position:fixed;top:0;left:0;right:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);
      z-index:1000;padding:12px 0;
    }
    .topbar .wrap{max-width:1100px;margin:0 auto;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 18px}
    .link{
      color:var(--primary);text-decoration:none;font-weight:900;padding:8px 16px;border-radius:25px;border:2px solid transparent;
      transition:.25s ease;font-size:.95rem;
    }
    .link:hover{background:var(--primary);color:#fff}
    .container{max-width:1100px;margin:0 auto}
    h1{ text-align:center;font-size:2.6rem;font-weight:900;color:var(--primary);margin-bottom:14px; }
    p{ text-align:center;max-width:850px;margin:0 auto 22px;font-weight:800;color:#111827;line-height:1.5; }
    .card{ background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:22px 18px; }
    @media (max-width:768px){ h1{font-size:2rem} }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <a class="link" href="./index.html#rsvp">RSVP</a>
      <a class="link" href="./index.html#home">Home</a>
      <a class="link" href="./index.html#updates">Email Updates</a>
      <a class="link" href="./index.html">Back to Main Site</a>
    </div>
  </div>

  <div class="container">
    <h1>Screener Survey</h1>
    <p>
      If you watched the screener, please fill this out. It directly helps us improve the movie and pitch materials.
    </p>

    <div class="card">
      <iframe
        data-tally-src="https://tally.so/embed/1AVZKg?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="980"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Mick Skylark Screener Survey"></iframe>
    </div>
  </div>

  <script>
    (function(){
      var d=document,w="https://tally.so/widgets/embed.js";
      function v(){
        if (typeof Tally !== "undefined") Tally.loadEmbeds();
        else d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){ e.src=e.dataset.tallySrc; });
      }
      if (typeof Tally !== "undefined") v();
      else if (d.querySelector('script[src="'+w+'"]') == null) {
        var s=d.createElement("script"); s.src=w; s.onload=v; s.onerror=v; d.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
