
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Golf Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
        }
        #canvas {
            background-color: #228B22; /* Green grass color */
            border: 2px solid #000;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 30px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="score">Strokes: 0</div>
        <div id="message">Hole in One!</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const messageDisplay = document.getElementById('message');

        // Game variables
        let ball = { x: 100, y: 300, radius: 10, vx: 0, vy: 0 };
        let hole = { x: 700, y: 300, radius: 15 };
        let strokes = 0;
        let isAiming = false;
        let aimStartX, aimStartY;
        let obstacles = [
            { x: 300, y: 200, width: 50, height: 200 }, // Vertical wall
            { x: 500, y: 100, width: 50, height: 300 }  // Another vertical wall
        ];

        // Physics constants
        const friction = 0.98;
        const gravity = 0; // No gravity for mini golf

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grass (already background)
            
            // Draw obstacles
            ctx.fillStyle = '#8B4513'; // Brown for walls
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // Draw hole
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF';
            ctx.fill();

            // Draw aiming line if aiming
            if (isAiming) {
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(aimStartX, aimStartY);
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function update() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Apply friction
            ball.vx *= friction;
            ball.vy *= friction;

            // Stop if velocity is very low
            if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) {
                ball.vx = 0;
                ball.vy = 0;
            }

            // Wall collisions (canvas boundaries)
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx = -ball.vx;
            }
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.vy = -ball.vy;
            }

            // Obstacle collisions
            obstacles.forEach(obs => {
                if (ball.x + ball.radius > obs.x && ball.x - ball.radius < obs.x + obs.width &&
                    ball.y + ball.radius > obs.y && ball.y - ball.radius < obs.y + obs.height) {
                    // Simple bounce: reverse velocity component based on collision side
                    // This is basic; for better physics, determine side of collision
                    ball.vx = -ball.vx;
                    ball.vy = -ball.vy;
                }
            });

            // Check if ball in hole
            const dx = ball.x - hole.x;
            const dy = ball.y - hole.y;
            if (Math.sqrt(dx * dx + dy * dy) < hole.radius + ball.radius / 2) {
                messageDisplay.textContent = `Hole in ${strokes}!`;
                messageDisplay.style.display = 'block';
                setTimeout(resetGame, 2000);
            }
        }

        function gameLoop() {
            draw();
            update();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            ball.x = 100;
            ball.y = 300;
            ball.vx = 0;
            ball.vy = 0;
            strokes = 0;
            updateScore();
            messageDisplay.style.display = 'none';
        }

        function updateScore() {
            scoreDisplay.textContent = `Strokes: ${strokes}`;
        }

        // Mouse events for aiming and putting
        canvas.addEventListener('mousedown', (e) => {
            if (ball.vx === 0 && ball.vy === 0) { // Only aim if ball is stopped
                isAiming = true;
                aimStartX = e.clientX - canvas.getBoundingClientRect().left;
                aimStartY = e.clientY - canvas.getBoundingClientRect().top;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isAiming) {
                aimStartX = e.clientX - canvas.getBoundingClientRect().left;
                aimStartY = e.clientY - canvas.getBoundingClientRect().top;
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isAiming) {
                isAiming = false;
                const endX = e.clientX - canvas.getBoundingClientRect().left;
                const endY = e.clientY - canvas.getBoundingClientRect().top;
                
                // Calculate velocity based on drag distance
                const power = 0.05; // Adjust for putt strength
                ball.vx = (ball.x - endX) * power;
                ball.vy = (ball.y - endY) * power;
                
                strokes++;
                updateScore();
            }
        });

        // Start the game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
