<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchandise - Mick Skylark: Mini Golf Prodigy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1E3A8A;
      --primary-dark: #1E40AF;
      --secondary: #FCD34D;
      --gold: #FBBF24;
      --light: #FFFFFF;
      --dark: #1F2937;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--dark);
      overflow-x: hidden;
      background: linear-gradient(135deg, #87CEEB 0%, #5DADE2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .merch-container {
      text-align: center;
      width: 100%;
      max-width: 900px;
      background: white;
      padding: 60px 40px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .merch-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(252, 211, 77, 0.12), transparent);
      animation: shine 3s infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .logo {
      max-width: 420px;
      width: 100%;
      margin-bottom: 30px;
      border-radius: 20px;
      position: relative;
      z-index: 1;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .coming-soon {
      font-size: 4.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 20px 0 10px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 30px;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    .preview-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin: 20px 0 10px;
      position: relative;
      z-index: 1;
    }

    .preview-item {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--gold) 100%);
      padding: 22px 16px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .preview-item:hover { transform: translateY(-4px); }

    .preview-item::before {
      content: '🎁';
      display: block;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .back-link {
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .back-link a:hover { color: var(--primary-dark); text-decoration: underline; }

    @media (max-width: 768px) {
      .merch-container { padding: 40px 20px; }
      h1 { font-size: 2rem; }
      .coming-soon { font-size: 2.8rem; }
      .subtitle { font-size: 1.05rem; }
    }
  </style>
</head>

<body>
  <div class="merch-container">
    <img src="logo-no-bg.png" alt="Mick Skylark Logo" class="logo" onerror="this.style.display='none';" />

    <h1>Official Merchandise</h1>
    <div class="coming-soon">COMING SOON!</div>
    <p class="subtitle">Get ready for exclusive Mick Skylark gear.</p>

    <div class="preview-items">
      <div class="preview-item">T-Shirts</div>
      <div class="preview-item">Hoodies</div>
      <div class="preview-item">Posters</div>
      <div class="preview-item">Hats</div>
      <div class="preview-item">Mugs</div>
      <div class="preview-item">& More</div>
    </div>

    <div class="back-link">
      <a href="./index.html">← Back to Main Site</a>
    </div>
  </div>
</body>
</html>
