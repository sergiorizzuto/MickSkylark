<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchandise - Mick Skylark: Mini Golf Prodigy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1E3A8A;
            --primary-dark: #1E40AF;
            --secondary: #FCD34D;
            --gold: #FBBF24;
            --dark: #1F2937;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body{
            font-family:'Poppins',sans-serif;
            color:var(--dark);
            background: linear-gradient(135deg, #87CEEB 0%, #5DADE2 100%);
            min-height:100vh;
            padding-top: 70px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        /* Top nav so it never looks “blank” */
        .topbar{
            position:fixed; top:0; left:0; right:0;
            background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.1);
            z-index:1000; padding:12px 0;
        }
        .topbar .wrap{
            max-width:1100px; margin:0 auto; display:flex; justify-content:center;
            gap:12px; flex-wrap:wrap; padding:0 18px;
        }
        .link{
            color:var(--primary); text-decoration:none; font-weight:900;
            padding:8px 16px; border-radius:25px; border:2px solid transparent;
            transition:.25s ease; font-size:.95rem;
        }
        .link:hover{ background:var(--primary); color:#fff; }

        .merch-container{
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 26px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 50px 30px;
            text-align:center;
            position: relative;
            overflow: hidden;
        }

        .merch-container::before{
            content:'';
            position:absolute;
            top:-50%; left:-50%;
            width:200%; height:200%;
            background: linear-gradient(45deg, transparent, rgba(252, 211, 77, 0.12), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .logo{
            max-width: 420px;
            width: 100%;
            border-radius: 18px;
            position: relative;
            z-index: 1;
            margin-bottom: 22px;
        }

        h1{
            font-size: 3rem;
            color: var(--primary);
            font-weight: 900;
            position: relative;
            z-index: 1;
        }

        .coming-soon{
            font-size: 4rem;
            font-weight: 900;
            margin: 18px 0 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        .subtitle{
            font-size: 1.25rem;
            font-weight: 800;
            margin: 8px 0 26px;
            position: relative;
            z-index: 1;
        }

        .preview-items{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            position: relative;
            z-index: 1;
            margin: 0 auto 18px;
        }

        .preview-item{
            background: linear-gradient(135deg, var(--secondary) 0%, var(--gold) 100%);
            border-radius: 14px;
            padding: 18px 12px;
            font-weight: 900;
            color: var(--primary);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .preview-item::before{
            content:'🎁';
            display:block;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .note{
            font-weight: 800;
            color: #111827;
            margin-top: 18px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            h1{ font-size: 2.2rem; }
            .coming-soon{ font-size: 3rem; }
            .merch-container{ padding: 40px 18px; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="wrap">
            <a class="link" href="./index.html#home">Home</a>
            <a class="link" href="./index.html#updates">Email Updates</a>
        </div>
    </div>

    <div class="merch-container">
        <img src="logo-no-bg.png" alt="Mick Skylark Logo" class="logo">

        <h1>Official Merchandise</h1>
        <div class="coming-soon">COMING SOON!</div>
        <div class="subtitle">Get ready for exclusive Mick Skylark gear.</div>

        <div class="preview-items">
            <div class="preview-item">T-Shirts</div>
            <div class="preview-item">Hoodies</div>
            <div class="preview-item">Posters</div>
            <div class="preview-item">Hats</div>
            <div class="preview-item">Mugs</div>
            <div class="preview-item">& More</div>
        </div>

        <div class="note">
            Want updates? Use the Email Updates section on the main site.
        </div>
    </div>

</body>
</html>
